# Insert INSIDE the existing TLS VirtualHost for zimnykurz.sk.
# This is not an ordinary .htaccess snippet. Required modules: proxy, proxy_http,
# ssl, headers, alias. Hosting administrator must enable them if unavailable.
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
# Adapt CA-bundle path to the hosting OS; never disable peer verification.
SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt

RedirectMatch 308 ^/priprava$ /priprava/
ProxyPass "/priprava/" "https://hub.biketrek.sk/zk/" connectiontimeout=10 timeout=60
ProxyPassReverse "/priprava/" "https://hub.biketrek.sk/zk/"

<Location "/priprava/">
    ProxyPreserveHost Off
    # Origin is preserved by default. Do not rewrite it to the Hub origin.
    RequestHeader set X-Forwarded-Host "zimnykurz.sk"
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy appends its peer to X-Forwarded-For. Remove untrusted input first.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Real-IP
</Location>

<IfModule mod_cache.c>
    CacheDisable /priprava/
</IfModule>

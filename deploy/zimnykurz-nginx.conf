# Insert INSIDE the existing HTTPS server block for zimnykurz.sk.
# Do not replace existing public website locations. Requires hosting-admin access.
location = /priprava {
    return 308 /priprava/;
}

location ^~ /priprava/ {
    # Both trailing slashes are intentional: replace only the /priprava/ prefix.
    proxy_pass https://hub.biketrek.sk/zk/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host hub.biketrek.sk;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Host zimnykurz.sk;
    proxy_set_header X-Forwarded-Proto https;
    # Overwrite, never accept a user-supplied client-IP chain.
    # If this nginx itself sits behind a CDN, configure its real_ip trust first.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_name hub.biketrek.sk;
    proxy_ssl_verify on;
    # Adapt to the hosting OS CA bundle path; never disable verification.
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_redirect https://hub.biketrek.sk/zk/ https://zimnykurz.sk/priprava/;
    proxy_cache off;
    proxy_no_cache 1;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
    # Cookies already use Path=/priprava and a host-only canonical domain.
    # Do not rewrite Origin, Set-Cookie Path or response bodies.
}
